apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devopsVG
  labels:
    app: frontend
    tier: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "classic"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8081
