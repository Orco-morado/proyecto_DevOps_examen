apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ventas
  namespace: devopsvg
  labels:
    app: backend-ventas
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ventas
  template:
    metadata:
      labels:
        app: backend-ventas
        tier: backend
    spec:
      containers:
        - name: backend-ventas
          image: ${ECR_REGISTRY}/${ECR_REPO_VENTAS}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: devopsvg-config
                  key: SPRING_DATASOURCE_URL_VENTA
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devopsvg-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devopsvg-db-secret
                  key: password
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/v1/ventas
              port: 8084
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/ventas
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 20
