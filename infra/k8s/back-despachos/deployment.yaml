apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despachos
  namespace: devopsVG
  labels:
    app: backend-despachos
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-despachos
  template:
    metadata:
      labels:
        app: backend-despachos
        tier: backend
    spec:
      containers:
        - name: backend-despachos
          image: ${ECR_REGISTRY}/${ECR_REPO_DESPACHOS}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: devopsvg-config
                  key: SPRING_DATASOURCE_URL_DESPACHO
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devopsvg-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devopsvg-db-secret
                  key: password
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/v1/despachos
              port: 8085
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/despachos
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 20
