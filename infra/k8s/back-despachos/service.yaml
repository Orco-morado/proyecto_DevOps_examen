apiVersion: v1
kind: Service
metadata:
  name: backend-despachos
  namespace: devopsVG
  labels:
    app: backend-despachos
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: backend-despachos
  ports:
    - name: http
      port: 8085
      targetPort: 8085

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-despachos-hpa
  namespace: devopsVG
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-despachos
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
