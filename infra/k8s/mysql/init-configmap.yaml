apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: devopsVG
data:
  init.sh: |
    #!/bin/sh
    set -e
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS db_despacho;"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS db_venta;"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON db_despacho.* TO '$MYSQL_USER'@'%';"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON db_venta.* TO '$MYSQL_USER'@'%';"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "FLUSH PRIVILEGES;"
