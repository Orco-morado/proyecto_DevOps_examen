name: Deploy devopsvg — EKS

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: deploy-eks-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devopsvg-eks
  K8S_NAMESPACE: devopsvg

jobs:
  build:
    name: Compilar aplicaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar Frontend
        working-directory: front_despacho
        run: npm ci && npm run build

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Compilar Backend Ventas
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: chmod +x mvnw && ./mvnw -B -DskipTests package

      - name: Compilar Backend Despachos
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: chmod +x mvnw && ./mvnw -B -DskipTests package

  docker-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: front_despacho
            ecr_repo: devopsvg-frontend
          - service: back-ventas
            context: back-Ventas_SpringBoot/Springboot-API-REST
            ecr_repo: devopsvg-back-ventas
          - service: back-despachos
            context: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
            ecr_repo: devopsvg-back-despachos
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build y push a ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-eks:
    name: Desplegar en EKS
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Conectar al cluster EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Namespace + Metrics Server + Secrets
        run: |
          echo "==> Comprobando nodos del clúster"
          kubectl get nodes
          kubectl describe nodes

          kubectl apply -f infra/k8s/namespace/
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=900s || {
            echo "==> ERROR: metrics-server rollout failed"
            echo "==> Pod status"
            kubectl get pods -n kube-system -l k8s-app=metrics-server
            echo "==> Describe pod"
            kubectl describe pod -n kube-system -l k8s-app=metrics-server
            echo "==> Logs"
            kubectl logs -n kube-system -l k8s-app=metrics-server --tail=100 || true
            exit 1
          }

          kubectl create secret generic devopsvg-db-secret \
            -n devopsvg \
            --from-literal=root-password='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --from-literal=username='${{ secrets.MYSQL_USER }}' \
            --from-literal=password='${{ secrets.MYSQL_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: kubectl apply + rollout
        env:
          ECR_REGISTRY: 847750225273.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x scripts/deploy-k8s.sh
          ./scripts/deploy-k8s.sh

      - name: Resumen del despliegue
        run: |
          echo "## Despliegue EKS" >> $GITHUB_STEP_SUMMARY
          kubectl get pods,svc -n ${{ env.K8S_NAMESPACE }} >> $GITHUB_STEP_SUMMARY

  validate:
    name: Validar despliegue
    runs-on: ubuntu-latest
    needs: deploy-eks
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Conectar al cluster EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Validar servicios
        env:
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          chmod +x scripts/validate-deployment.sh
          ./scripts/validate-deployment.sh
